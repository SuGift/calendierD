<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="referrer" content="no-referrer">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CalendierD</title>
</head>
<body>
  <h2>CalendierD</h2>
  <p id="status">Connecting to CalendierD...</p>

  <script>
    (function () {
      'use strict';

      const APPS_SCRIPT_URL =
        'https://script.google.com/a/~/macros/s/' +
        'AKfycbykMQxQ4zVU0WT33OsbmHNELnZ-YW5FVyJ8-hDIN_1Qk9L8UB3JDRB_Jyy9Tz38Y63tqA' +
        '/exec';

      const status = document.getElementById('status');
      const params = new URLSearchParams(window.location.search);

      const code = params.get('code');
      const state = params.get('state');
      const error = params.get('error');

      const isCallback =
        params.has('code') ||
        params.has('state') ||
        params.has('error');

      // Remove sensitive parameters from the visible URL.
      window.history.replaceState(
        null,
        '',
        window.location.pathname
      );

      // 1. Direct access to CalendierD.
      if (!isCallback) {
        status.textContent = 'Opening CalendierD...';
        window.location.replace(APPS_SCRIPT_URL);
        return;
      }

      // 2. Validate OAuth callback parameters.
      if (!state || Boolean(code) === Boolean(error)) {
        status.textContent =
          'Invalid OAuth response. Please sign in again.';
        return;
      }

      // 3. Forward OAuth callback to Apps Script.
      const forward = new URL(APPS_SCRIPT_URL);

      if (code) {
        forward.searchParams.set('code', code);
      }

      if (error) {
        forward.searchParams.set('error', error);
      }

      forward.searchParams.set('state', state);

      status.textContent = 'Completing Google sign-in...';

      // Forward only code, state and error.
      // Never forward authuser.
      window.location.replace(forward.toString());

    })();
  </script>
</body>
</html>
